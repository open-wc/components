name: Verify changes

on: pull_request

jobs:
  verify:
    timeout-minutes: 15
    # Prevents verfiy action from PRs via forks
    if: github.repository == 'open-wc/components'
    name: Verify Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Set up GitHub Actions caching for Wireit.
      - uses: google/wireit@setup-github-actions-caching/v2

      - name: Install Dependencies
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Validating Types
        run: npm run types

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Running Tests
        run: npm run test
